<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="projects">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>projects</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The ground the scene stands on, painted before Flutter exists.

    Without it the browser shows a white page until the engine's first frame,
    and that frame brings the dark backdrop and the mark on together. However
    gently the mark then eases in, the *screen* has already arrived in one
    step, and the eye reads the whole thing as having appeared at once —
    which is what an in-app animation cannot fix, because the app is not
    running yet.

    Matched to `AppColors.loadingBackdrop`. If that changes, this has to: a
    mismatch shows as a flash of the wrong dark on the first frame.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0C;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
