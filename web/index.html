<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by `flutter build`'s `--base-href`. The site is served from the
    root of its own domain, so this stays "/" — it was "/flutter/" on the
    previous site, where the app was one section of a React page rather than
    the whole of it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Everything below is read *before* Flutter starts, and by things that
    never start it at all — a tab, a search result, a link pasted into a
    chat. `MaterialApp.title` sets the tab once the engine is running, which
    is too late for all three.
  -->
  <title>Vishal Raj</title>
  <!-- Positioning line (DRAFT for Vishal, 2026-11-13): one line, used here, on /static and in the manifest. -->
  <meta name="description" content="Vishal Raj. Mobile and Flutter engineer. Platform builder.">
  <link rel="canonical" href="https://www.vishalraj.space/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vishal Raj">
  <meta property="og:title" content="Vishal Raj">
  <meta property="og:description" content="Mobile and Flutter engineer. Platform builder.">
  <meta property="og:url" content="https://www.vishalraj.space/">
  <meta property="og:image" content="https://www.vishalraj.space/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vishal Raj: the title screen, a name over a glowing horizon">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Vishal Raj">
  <meta name="twitter:description" content="Mobile and Flutter engineer. Platform builder.">
  <meta name="twitter:image" content="https://www.vishalraj.space/og-image.jpg">

  <!--
    The site's own mark, and only it. There was an SVG here first, carried
    over from the previous site along with everything else in its public
    folder — a different logo entirely, in purple and blue — and because it
    was listed first, browsers preferred it. The tab showed the old brand.
    Every file below is now the same mark, so there is nothing to prefer
    wrongly.
  -->
  <!--
    The mark, in four formats because browsers disagree about which they want.
    `.ico` carries the small raster sizes Windows and older browsers ask for;
    the SVG is what a modern browser prefers and the only one that stays sharp
    on a high-density tab strip; the touch icon is what iOS puts on a home
    screen. Listed `.ico` first with `sizes="any"` so a browser that
    understands SVG skips it rather than downloading both.
  -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vishal Raj">
  <meta name="theme-color" content="#0A0A0C">
  <link rel="manifest" href="manifest.json">

  <!--
    The ground the scene stands on, painted before Flutter exists.

    Without it the browser shows a white page until the engine's first frame,
    and that frame brings the dark backdrop and the mark on together. However
    gently the mark then eases in, the *screen* has already arrived in one
    step, and the eye reads the whole thing as having appeared at once —
    which is what an in-app animation cannot fix, because the app is not
    running yet.

    Matched to `AppColors.loadingBackdrop`. If that changes, this has to: a
    mismatch shows as a flash of the wrong dark on the first frame.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0C;
    }
    /*
      The first paint (PORTFOLIO-8): the loading screen's mark, in plain HTML,
      on the same ground, before a byte of main.dart.js or CanvasKit has
      arrived. Sized by the loading screen's own rule
      (LogoConfig.loadingMarkWidthFor: min(30vw, 460px, 50vh / aspect) times
      0.78), white like the inverted mark, and lifted by half the readout
      beneath it so it sits where Flutter's first frames put it. Faded out on
      Flutter's first frame, while Flutter's mark rises underneath.
    */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0C;
      z-index: 2;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #splash img {
      width: calc(min(30vw, 460px, 58.333vh) * 0.78);
      height: auto;
      filter: invert(1);
      transform: translateY(-18px);
    }
    #splash.gone {
      opacity: 0;
    }
  </style>
  <!--
    Fetched as early as the parser sees this, not when flutter_bootstrap.js
    gets round to asking. CanvasKit comes from Google's CDN under the engine's
    hash; a preload would hard-code that hash and go stale on the next Flutter
    upgrade, so the connection is opened instead.
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body>
  <!--
    What a crawler and a reader without JavaScript get.
    
    The scene is drawn on a canvas, so there is no text in this page for
    either of them to find — the site would otherwise be a blank document
    with a title. Removed from the DOM the moment Flutter has a frame up, so
    it never shows to anybody who can see the real thing.
  -->
  <noscript>
    <p style="color:#F0E4CC;font-family:system-ui,sans-serif;padding:2rem">
      Vishal Raj — mobile and Flutter engineer.
      This site is an interactive gallery and needs JavaScript.
      <a href="/static/" style="color:#A9821F">Read the plain version</a>.
    </p>
  </noscript>

  <script>
    // Flutter's first frame is drawn under the splash; fade it out over the
    // mark Flutter is bringing up, then take it out of the page.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 700);
    });
  </script>
