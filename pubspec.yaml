name: portfolio
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flame: ^1.38.0
  flame_audio: ^2.12.2
  flame_svg: ^1.12.2
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.2
  vector_math: ^2.4.2
  web: ^1.1.1
  flame_bloc: ^1.12.24
  flutter_svg: ^2.3.0
  flutter_scene: 0.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  flame_test: ^2.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: MonoLoading
      fonts:
        - asset: fonts/mono_loading.ttf
    - family: Apertura
      fonts:
        - asset: fonts/aperturaregular.ttf
    - family: ModrntUrban
      fonts:
        - asset: fonts/modrnt_urban.otf

  assets:
    # Listed file by file rather than by directory, and the omissions are
    # deliberate. Between them these three downloads also carry 65MB of
    # displacement and OpenEXR normal maps, Blender/USD/MaterialX sources and
    # a preview thumbnail — none of which the renderer can use (see
    # `TextureSet`). A directory entry would bundle every one of them.
    #
    # Every set now uses the OpenGL normal variant, never the DirectX one:
    # `NormalDX` has green inverted, which lights every bump from the wrong
    # side and reads as the surface being subtly inside-out.
    - assets/textures/floor/Tiles013_1K-JPG_Color.jpg
    - assets/textures/floor/Tiles013_1K-JPG_Roughness.jpg
    - assets/textures/floor/Tiles013_1K-JPG_NormalGL.jpg
    - assets/textures/roof/OfficeCeiling001_1K-JPG_Color.jpg
    - assets/textures/roof/OfficeCeiling001_1K-JPG_Roughness.jpg
    - assets/textures/roof/OfficeCeiling001_1K-JPG_NormalGL.jpg
    - assets/textures/roof/OfficeCeiling001_1K-JPG_AmbientOcclusion.jpg
    - assets/textures/keys/set_1/Metal023_1K-JPG_Color.jpg
    - assets/textures/keys/set_1/Metal023_1K-JPG_Roughness.jpg
    - assets/textures/keys/set_1/Metal023_1K-JPG_NormalGL.jpg
    - assets/textures/keys/set_1/Metal023_1K-JPG_Metalness.jpg
    - assets/textures/keys/set_2/Metal056B_1K-JPG_Color.jpg
    - assets/textures/keys/set_2/Metal056B_1K-JPG_Roughness.jpg
    - assets/textures/keys/set_2/Metal056B_1K-JPG_NormalGL.jpg
    - assets/textures/keys/set_2/Metal056B_1K-JPG_Metalness.jpg
    - assets/textures/keys/set_3/Metal022_1K-JPG_Color.jpg
    - assets/textures/keys/set_3/Metal022_1K-JPG_Roughness.jpg
    - assets/textures/keys/set_3/Metal022_1K-JPG_NormalGL.jpg
    - assets/textures/keys/set_3/Metal022_1K-JPG_Metalness.jpg
    - assets/textures/keyboard_base/Metal048B_1K-JPG_Color.jpg
    - assets/textures/keyboard_base/Metal048B_1K-JPG_Roughness.jpg
    - assets/textures/keyboard_base/Metal048B_1K-JPG_NormalGL.jpg
    - assets/textures/frame_testimonials/Wood020_1K-JPG_Color.jpg
    - assets/textures/frame_testimonials/Wood020_1K-JPG_Roughness.jpg
    - assets/textures/frame_testimonials/Wood020_1K-JPG_NormalGL.jpg
    - assets/textures/frame/Wood066_1K-JPG_Color.jpg
    - assets/textures/frame/Wood066_1K-JPG_Roughness.jpg
    - assets/textures/frame/Wood066_1K-JPG_NormalGL.jpg
    - assets/textures/wall/Marble004_1K-JPG_Color.jpg
    - assets/textures/wall/Marble004_1K-JPG_Roughness.jpg
    - assets/textures/wall/Marble004_1K-JPG_NormalGL.jpg
    # A multi-file glTF is a *set*: the .gltf names scene.bin as its geometry
    # buffer, and the model cannot load without it. Listed by directory so a
    # companion arriving later is picked up without another pubspec edit.
    - assets/objects/
    - assets/images/logo.png
    - assets/audio/
    - flutter_scene_generated/

  shaders:
    - assets/shaders/logo.frag
    - assets/shaders/god_rays.frag
    - assets/shaders/metallic_text.frag
    - assets/shaders/background_run_v2.frag
    - assets/shaders/bold_text_entrance.frag
